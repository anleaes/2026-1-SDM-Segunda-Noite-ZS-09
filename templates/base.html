{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Locadora{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background: #f0f0f0;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #ccc;
        }

        header a {
            text-decoration: none;
            color: #333;
        }

        header .logo {
            font-weight: bold;
            margin-right: 20px;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        nav a img {
            width: 24px;
            height: 24px;
        }

        .usuario-area {
            margin-left: auto;
        }

        main {
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            margin-top: 10px;
        }

        table th,
        table td {
            border: 1px solid #ccc;
            padding: 6px 10px;
        }

        form p {
            margin: 8px 0;
        }
    </style>
</head>

<body>
    {% if request.session.usuario_id %}
    <header>
        <a href="/" class="logo">LocadoraApp</a>
        <nav>
            <a href="/adicionais/lista/" title="Adicionais"><img src="{% static 'img/icons/adicional.svg' %}" alt="Adicionais"></a>
            <a href="/agencias/lista/" title="Agências"><img src="{% static 'img/icons/agencia.svg' %}" alt="Agências"></a>
            <a href="/carteiras/lista/" title="CNHs"><img src="{% static 'img/icons/cnh.svg' %}" alt="CNHs"></a>
            <a href="/categorias-veiculo/lista/" title="Categorias"><img src="{% static 'img/icons/categoria.svg' %}" alt="Categorias"></a>
            <a href="/clientes/lista/" title="Clientes"><img src="{% static 'img/icons/cliente.svg' %}" alt="Clientes"></a>
            <a href="/funcionarios/lista/" title="Funcionários"><img src="{% static 'img/icons/funcionario.svg' %}" alt="Funcionários"></a>
            <a href="/itens-adicionais/lista/" title="Itens Adicionais"><img src="{% static 'img/icons/item-adicional.svg' %}" alt="Itens Adicionais"></a>
            <a href="/manutencoes/lista/" title="Manutenções"><img src="{% static 'img/icons/manutencao.svg' %}" alt="Manutenções"></a>
            <a href="/multas/lista/" title="Multas"><img src="{% static 'img/icons/multa.svg' %}" alt="Multas"></a>
            <a href="/pagamentos/lista/" title="Pagamentos"><img src="{% static 'img/icons/pagamento.svg' %}" alt="Pagamentos"></a>
            <a href="/reservas/lista/" title="Reservas"><img src="{% static 'img/icons/reserva.svg' %}" alt="Reservas"></a>
            <a href="/seguros/lista/" title="Seguros"><img src="{% static 'img/icons/seguro.svg' %}" alt="Seguros"></a>
            <a href="/veiculos/lista/" title="Veículos"><img src="{% static 'img/icons/veiculo.svg' %}" alt="Veículos"></a>
        </nav>
        <div class="usuario-area">
            Ola, {{ request.session.usuario_nome }} | <a href="{% url 'logout' %}">Sair</a>
        </div>
    </header>
    {% endif %}

    <main>
        {% block body %}{% endblock %}
    </main>
</body>

</html>
